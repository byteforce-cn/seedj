name: 功能建议
description: 提出新能力或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先检索现有 Issues 与 [ROADMAP](https://github.com/byteforce-cn/seedj/blob/main/docs/ROADMAP.md)，并优先描述"要解决的问题"。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前痛点 / 使用场景 / 现有替代方案及其不足
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: API 草案 / 使用示例 / 配置形态（如已有想法）
      render: java
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: 兼容性影响
      description: 是否变更对外 API / wire 契约 / 默认行为；是否需要 ADR
    validations:
      required: false
