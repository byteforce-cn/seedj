name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 18 * * *" # conformance nightly（UTC）

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: resolve eis ref
        id: eis
        run: |
          pin="$(head -n 1 config/conformance/eis-ref.txt | tr -d '[:space:]')"
          case "$pin" in
            sha=*) echo "ref=${pin#sha=}" >> "$GITHUB_OUTPUT" ;;
            tag=*) echo "ref=${pin#tag=}" >> "$GITHUB_OUTPUT" ;;
            *) echo "invalid config/conformance/eis-ref.txt: $pin" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/eis
          ref: ${{ steps.eis.outputs.ref }}
          path: .eis
          token: ${{ secrets.EIS_READ_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: install diff-cover
        run: pipx install diff-cover
      - name: verify（与本地同源脚本）
        env:
          MAVEN_FLAGS: ""
          EIS_ROOT: ${{ github.workspace }}/.eis
          DIFF_COVER_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
        run: bash config/ci/verify.sh

  conformance:
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: resolve eis ref
        id: eis
        run: |
          pin="$(head -n 1 config/conformance/eis-ref.txt | tr -d '[:space:]')"
          case "$pin" in
            sha=*) echo "ref=${pin#sha=}" >> "$GITHUB_OUTPUT" ;;
            tag=*) echo "ref=${pin#tag=}" >> "$GITHUB_OUTPUT" ;;
            *) echo "invalid config/conformance/eis-ref.txt: $pin" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/eis
          ref: ${{ steps.eis.outputs.ref }}
          path: .eis
          token: ${{ secrets.EIS_READ_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: spec alignment
        env:
          EIS_ROOT: ${{ github.workspace }}/.eis
        run: bash config/conformance/check-spec-alignment.sh
      - name: conformance（需要规范仓库）
        env:
          MAVEN_FLAGS: ""
          SPEC_ROOT: ${{ github.workspace }}/.eis
        run: bash config/ci/conformance.sh -Dspec.root="$SPEC_ROOT"

  release-gates:
    name: release-gates
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: release gates
        env:
          MAVEN_FLAGS: ""
          SPOTBUGS_FAIL_ON_ERROR: "true"
          # 首个正式版本没有可比较的基线；之后的 tag 必须解析到基线，否则 check-compat.sh 失败。
          SEEDJ_FIRST_RELEASE: ${{ github.ref_name == 'v1.0.0' }}
        run: |
          bash config/ci/verify.sh
          bash config/ci/dependency-check.sh
          bash config/ci/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: seedj-sbom
          path: "**/target/seedj-sbom.json"
          if-no-files-found: error

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: install
        run: npm ci
      - name: lint
        run: npm run docs:lint
      - name: build（死链即失败）
        run: npm run docs:build
      - name: nav
        run: npm run docs:nav
