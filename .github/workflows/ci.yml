# seedj CI 主门禁：全量构建 + 单测 + JaCoCo 覆盖率门禁 + 零测试守卫
# 对应 docs/releasing.md §1 检查清单第 1 项；nightly 集成档见 it.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 全量 verify（单测 + 覆盖率门禁）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify（含 JaCoCo 门禁、零测试守卫与 SpotBugs 静态分析）
        run: ./mvnw -B -T1C verify -Panalysis

      - name: 上传测试报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*'
          if-no-files-found: ignore
