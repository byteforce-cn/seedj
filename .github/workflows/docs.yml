name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: install
        run: npm ci
      - name: lint
        run: npm run docs:lint
      - name: build（死链即失败）
        run: npm run docs:build
      - name: nav
        run: npm run docs:nav
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: pages missing
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::Pages 未启用，本次跳过部署：Settings → Pages → Source 选择 GitHub Actions。"
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
