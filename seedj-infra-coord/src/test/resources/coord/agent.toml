agent_addr = "127.0.0.1:__AGENT__"
http_addr = "127.0.0.1:__AGENT_HTTP__"
data_dir = "/tmp/coord-agent-data"
discovery_mode = "static"
static_peers = ["127.0.0.1:__GRPC__"]
data_plane = "v2"

[auth]
enabled = false

[services]
idgen = true
lock = true
mq = true
pki = true
transit = true
policy = true
workflow = true
workflow_durable = true
# 服务代终端用户白名单（auth 关闭时调用方主体是 anonymous）；seedj 适配器所有席位动作都靠 on_behalf_of。
workflow_on_behalf_services = ["anonymous", "root"]
