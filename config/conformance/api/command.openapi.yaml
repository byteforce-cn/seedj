# command.openapi.yaml — EIS 命令 API 契约（Spec v1.0.0，冻结）
# 元结构：POST /commands/{commandType}；必含 payload + idempotency_key；响应 202/400/409
openapi: 3.1.0
info:
  title: EIS Command API
  version: 1.0.0
  description: |
    写操作统一入口。所有命令必须携带幂等键：
    - 首次提交：校验 + 规则处理 → 202（已接受）或 400（拒绝）
    - 重复提交（同幂等键）：返回原结果；若内容不一致 → 409
    - 结果查询：GET /commands/{id} 查询命令终态（异步语义）
    - 所有拒绝必须携带错误码（见 error-codes.yaml）
    - 写入专用派生字段（writeOnly）：载荷携带原始值，由域属主服务在写路径派生后落库；
      原始值与派生值不得进入命令记录/读投影/日志（见
      01-data-contract/write-only-fields.rules.yaml）
    - 每个命令的 type / permission / payloadSchema / objectType 必须同时登记在
      config/conformance/commands.yaml；CommandApiConformanceTest 保证登记表与
      CommandCatalog 的 CommandDescriptor 一一对应。

paths:
  /commands/{commandType}:
    post:
      summary: 提交命令
      operationId: submitCommand
      parameters:
        - name: commandType
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_.]*$'
        - name: If-Match
          in: header
          required: false
          description: |
            期望对象版本（ETag 形式，如 "7"）；与 body 的 expected_version 同时存在
            且不一致时返回 400。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '202':
          description: 命令已接受
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAccepted'
        '400':
          description: 命令被拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandRejected'
        '409':
          description: 幂等冲突或乐观锁版本冲突（版本冲突带 Retry-After）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdempotencyConflict'

  /commands/{id}:
    get:
      summary: 查询命令结果（异步语义）
      operationId: getCommand
      description: |
        GET 路径段解析为命令 ID（command_id）；与 POST /commands/{commandType} 的
        commandType 路径段互不冲突（HTTP 方法不同）。命令终态：accepted / rejected。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 命令当前状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandStatus'
        '404':
          description: 命令不存在

components:
  schemas:
    CommandRequest:
      type: object
      required: [type, payload, idempotency_key]
      properties:
        type:
          type: string
        payload:
          type: object
        idempotency_key:
          type: string
        targets:
          type: array
          items:
            type: string
            format: uuid
        expected_version:
          type: integer
          format: int64
          minimum: 0
          description: 期望对象版本；0 仅创建，>0 必须等于当前版本

    CommandAccepted:
      type: object
      description: |
        命令执行结果定位（ADR-0014）：
        - 命令响应只表达「命令执行结果」，**不得携带读模型投影**（业务字段/关联字段/计算字段一律由读接口返回）；
        - 双时间轴默认路径返回 `locator` + `version`：`locator` = 聚合根 ID（单聚合命令）或流程实例 ID
          （长流程命令）；事件溯源路径返回 `target_ref` + `version`：`target_ref` = 聚合标识的规范文本
          （`IdCodec.encode`）。`locator` 与 `target_ref` 二选一，`version` 恒有，语义与
          `01-data-contract/object.schema.json` 的 `version` 相同（每次写 +1）；
        - 失败响应（400/409）不携带 `locator`/`target_ref`/`version`；
        - `locator` 或 `target_ref` + `version` 是命令契约与查询契约之间唯一的桥：调用方据此读取/等待投影，
          而不是依赖命令响应里的业务数据。
      properties:
        command_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted]
        event_ids:
          type: array
          items:
            type: string
            format: uuid
        locator:
          type: string
          format: uuid
          description: 聚合根 ID（单聚合命令）或流程实例 ID（长流程命令）；与 target_ref 二选一
        target_ref:
          type: string
          maxLength: 255
          description: 事件溯源命令的聚合标识文本；与 locator 二选一
        version:
          type: integer
          minimum: 1
          description: locator 或 target_ref 对应对象的版本（每次写 +1）

    CommandRejected:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [rejected]
        reason:
          type: string
        code:
          type: string
          description: 错误码（见 error-codes.yaml），如 EIS-400-001

    IdempotencyConflict:
      type: object
      properties:
        idempotency_key:
          type: string
        original_command_id:
          type: string
          format: uuid
        original_result:
          type: object

    CommandStatus:
      type: object
      required: [command_id, status]
      properties:
        command_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, accepted, rejected]
        event_ids:
          type: array
          items:
            type: string
            format: uuid
        target_ref:
          type: string
          maxLength: 255
          description: 事件溯源命令的聚合标识文本（存在时）
        reason:
          type: string
        code:
          type: string
          description: 错误码（rejected 时，见 error-codes.yaml）
        issued_at:
          type: string
          format: date-time
